<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ytqd</title>
    <link rel="icon" type="images/png" href="images/anemoiaicon.png">
    <style>
        body{
            background-color: black;
            color: white;
            font-family: serif;
            text-align: center;
            font-size: 1em;
        }
        h1{
            font-family: serif;
            text-align: center;
            font-size: 4em;
            margin: 5%;
        }
        button{
            font-family: serif;
            font-size: 1em;
            padding: 10px;
        }
        h6{
            font-color: gray;
            text-align: right;
            margin-right:15%;
        }
    </style>
</head>
<body>
    <h1>anemoia</h1>
    
    <button type="button" id="random">random</button>

    <br> <img id = "image" src = "images/1.png" width = "50%">
    <br> <p id="caption"></p>

    <button onclick="document.getElementById('title').scrollIntoView({behavior: 'smooth'})" type="button">go to top.</button>

    <h6 id = "credits"></h6>

    <script>
    const images = [
        { 
            ima: 'images/1.png',
            cred:'found this image on wikipedia and edited it https://commons.wikimedia.org/wiki/File:Pselectin.PNG',
            cap: 'a really cool p-selectin'
        }
    ];
      
    const img = document.getElementById('image');
    const button = document.getElementById('random');

    function randoming() {
        const random = Math.floor(Math.random() * images.length);
        const selected = images[random];
         document.getElementById('image').src = selected.ima;
        document.getElementById('credits').textContent = selected.cred;
        document.getElementById('caption').textContent = selected.cap;
    }

    randoming();

    button.addEventListener('click', randoming);
  </script>
</body>
</html>
