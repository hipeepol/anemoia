<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>anemoia</title>
    <link rel="icon" type="images/png" href="images/anemoiaicon.png">
    <style>
        body{
            background-color: black;
            color: white;
            font-family: serif;
            text-align: center;
            font-size: 1em;
            height: 100%;
        }
        h1{
            font-family: serif;
            text-align: center;
            font-size: 4em;
            margin: 1.5% 3% 1.5% 15px;
        }
        button{
            font-family: serif;
            font-size: 1em;
            padding: 10px;
        }
        h6{
            color: gray;
        }
        #logobo{
            float: left;
            height: 2.8em;
        }
        #heading{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #footer{
            display: flex;
            justify-content: center;
            align-items: center;
            background-color:white;
            color:black;
            margin:0%;
        }
        a{
            color: black;
        }
    </style>
</head>
<body>
    <div id = "heading">
    <img id = "logobo" src = "images/anemoiaicon.png">
    <h1 id = "title">anemoia</h1>
    </div>

    <button type="button" id="backward">&lt;</button>
    <button type="button" id="random">random</button>
    <button type="button" id="forward">&gt;</button>

    <br><br> <img id = "image" src = "images/1.png" width = "35%">
    <br> <p id="caption"></p>
    <h6 id = "credits"></h6>

    <button onclick="document.getElementById('title').scrollIntoView({behavior: 'smooth'})" type="button">go to top</button>
    <br><br>

    <div id = "footer">
        <p>made by waffl - <a href="https://github.com/hipeepol">github</a> - comic posted on [</p>
         <p id = "date"></p>]
    </div>

    <script>
    const images = [
        {
            ima: 'images/1.png',
            cred:'found this image on wikipedia and edited it https://commons.wikimedia.org/wiki/File:Pselectin.PNG',
            cap: 'a really cool p-selectin',
            day: "3 Jun 2026"
        },
        {
            ima: 'images/2.png',
            cred:'',
            cap: 'but nobody came... because it is just a game, is it not?',
            day: "1 Oct 2026"
        },
        {
            ima: 'images/3.png',
            cred:'credit to xkcd for being awesome',
            cap: 'you should ignore the fact that i cant code good ui either',
            day: "1 Oct 2026"
        }
    ];
      
    const randomer = document.getElementById('random');
    const backwarder = document.getElementById('backward');
    const forwarder = document.getElementById('forward');

    let selected = 0;

    function display(choose){
        selected = choose;
        const select = images[selected];
        document.getElementById('image').src = select.ima;
        document.getElementById('credits').textContent = select.cred;
        document.getElementById('caption').textContent = select.cap;
        document.getElementById('date').textContent = select.day;
    }

    function randoming() {
        display(Math.floor(Math.random() * images.length));
    }
    function forward(){
        display((selected + 1) % images.length);
    }
    function backward(){
        display(((selected - 1) + images.length) % images.length);
    }

    randoming();

    randomer.addEventListener('click', randoming);
    forwarder.addEventListener('click', forward);
    backwarder.addEventListener('click', backward);
  </script>
</body>
</html>
